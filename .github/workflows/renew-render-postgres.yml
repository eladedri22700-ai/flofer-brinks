# Free Render Postgres expires 30 days after it is created.
# Requires repo secret RENDER_API_KEY (Render → Account Settings → API Keys).
#
# Runs WEEKLY, not monthly. The script below treats a database with more than
# 7 days left as healthy and does nothing, so the check has to run more often
# than that window or it can miss an expiry entirely: a database created on
# the 10th expires on the 9th, a monthly run on the 1st sees 8 days left and
# skips it, and the next check lands three weeks after the service is dead.
name: renew-render-postgres

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  renew-if-needed:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure free Postgres is available
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OWNER_ID: tea-d9drfhb7uimc73c3c1u0
          SERVICE_ID: srv-d9drht3rjlhs73b7or80
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::secrets.RENDER_API_KEY is not set, so the free Postgres"
            echo "::error::cannot be renewed and the service will go down when it"
            echo "::error::expires. Add it in Settings -> Secrets and variables ->"
            echo "::error::Actions, from Render -> Account Settings -> API Keys."
            exit 1
          fi

          AUTH="Authorization: Bearer $RENDER_API_KEY"
          echo "Listing Postgres..."
          # Capture the status code instead of letting -f collapse every
          # failure into "curl: (22)". A 401 here is the whole story and it
          # should read like one.
          code=$(curl -sS -o /tmp/pg.json -w "%{http_code}" \
            -H "$AUTH" -H "Accept: application/json" \
            "https://api.render.com/v1/postgres?limit=20&ownerId=$OWNER_ID" || echo 000)

          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::Render rejected RENDER_API_KEY (HTTP $code). The secret is"
            echo "::error::set but no longer valid - most likely revoked or rotated."
            echo "::error::Fix: Render -> Account Settings -> API Keys -> create a new"
            echo "::error::key, then update the RENDER_API_KEY secret in this repo."
            echo "::error::Until this is fixed the free Postgres cannot be replaced"
            echo "::error::and the service stays down once the current one expires."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Render API returned HTTP $code when listing Postgres."
            head -c 500 /tmp/pg.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys, urllib.request, datetime
          key = os.environ["RENDER_API_KEY"]
          owner = os.environ["OWNER_ID"]
          svc = os.environ["SERVICE_ID"]
          rows = json.load(open("/tmp/pg.json"))
          now = datetime.datetime.now(datetime.timezone.utc)

          def api(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  "https://api.render.com/v1" + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {key}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read().decode() or "{}"
                  return json.loads(raw) if raw.strip() else {}

          healthy = None
          for row in rows:
              db = row.get("postgres") or row
              status = db.get("status")
              exp = db.get("expiresAt")
              print(f"db={db.get('id')} name={db.get('name')} status={status} expires={exp}")
              days_left = None
              if exp:
                  exp_dt = datetime.datetime.fromisoformat(exp.replace("Z", "+00:00"))
                  days_left = (exp_dt - now).days
              if status == "available" and (days_left is None or days_left > 7):
                  healthy = db
                  break
              if status in ("suspended", "unavailable", "expired") or (days_left is not None and days_left <= 0):
                  try:
                      api("DELETE", f"/postgres/{db['id']}")
                      print("deleted", db["id"])
                  except Exception as e:
                      print("delete failed", e)

          if healthy:
              print("OK existing DB", healthy.get("id"))
              sys.exit(0)

          print("Creating new free Postgres...")
          created = api("POST", "/postgres", {
              "name": f"flofer-brinks-db-{now.strftime('%Y%m%d')}",
              "ownerId": owner,
              "plan": "free",
              "region": "frankfurt",
              "version": "16",
              "databaseName": "flofer_brinks",
              "databaseUser": "flofer",
          })
          db = created.get("postgres") or created
          db_id = db["id"]
          print("created", db_id)
          for _ in range(60):
              info = api("GET", f"/postgres/{db_id}")
              db = info.get("postgres") or info
              if db.get("status") == "available":
                  break
              import time; time.sleep(5)
          else:
              raise SystemExit("DB not available")

          ci = api("GET", f"/postgres/{db_id}/connection-info")
          url = ci.get("internalConnectionString") or ci.get("connectionString")
          if not url:
              raise SystemExit("No connection string")

          existing = api("GET", f"/services/{svc}/env-vars")
          payload = []
          seen = False
          for row in existing:
              ev = row.get("envVar") or row
              if ev.get("key") == "DATABASE_URL":
                  payload.append({"key": "DATABASE_URL", "value": url})
                  seen = True
              else:
                  item = {"key": ev["key"]}
                  if ev.get("value") is not None:
                      item["value"] = ev["value"]
                  elif ev.get("generateValue"):
                      item["generateValue"] = True
                  else:
                      item["value"] = ""
                  payload.append(item)
          if not seen:
              payload.append({"key": "DATABASE_URL", "value": url})
          api("PUT", f"/services/{svc}/env-vars", payload)
          dep = api("POST", f"/services/{svc}/deploys", {"clearCache": "clear"})
          print("deploy", (dep.get("deploy") or dep).get("id"))
          PY
