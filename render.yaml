# FLOFER BRINKS — Render Blueprint (free web service)
# https://render.com/docs/blueprint-spec
#
# Database: Neon free Postgres (https://neon.tech) — unlike Render's free
# Postgres it does not expire after 30 days. Paste its connection string into
# DATABASE_URL in the Render dashboard. Full steps: docs/DEPLOY.md

services:
  - type: web
    name: flofer-brinks
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_AUTH
        value: "false"
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_DIST
        value: /app/frontend/dist
      - key: APP_PUBLIC_URL
        value: https://flofer-brinks.onrender.com
      - key: CORS_ORIGINS
        value: "*"
      - key: FREE_GEO
        value: "true"
      - key: SEED_RESET_PASSWORDS
        value: "false"
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PYTHONPATH
        value: /app
